name: app_imago
description: A new Flutter project.
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+2

environment:
  # Lantai dinaikkan dari 3.0.6 ke 3.3.0 untuk extension type, yang dipakai
  # jembatan js_interop di lib/platform/. Ini hanya batas MINIMUM — compiler
  # yang dipakai tetap sama (Dart 3.12.2), jadi keluaran build mobile tidak
  # berubah. Tidak ada fitur baru yang dipakai di jalur kode mobile.
  sdk: '>=3.3.0 <4.0.0'

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter


  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.2
  camera: ^0.10.5+9
  permission_handler: ^11.0.1
  animate_do: ^3.0.2
  glassmorphism: ^3.0.0
  google_mlkit_image_labeling: ^0.12.0
  google_mlkit_text_recognition: ^0.13.1
  audioplayers: ^5.2.1
  shared_preferences: ^2.2.2
  file_picker: ^12.2.0
  path_provider: ^2.1.2
  model_viewer_plus: ^1.10.0
  google_mlkit_object_detection: ^0.13.1
  webview_flutter: ^4.14.1
  share_plus: ^13.3.1
  firebase_core: ^5.0.0
  cloud_firestore: ^7.0.0
  firebase_auth: ^7.0.0
  path: ^1.9.1
  # Sudah ada sebagai dependensi transitif; dideklarasikan eksplisit karena
  # lib/platform/web_download_web.dart mengimpornya langsung. Hanya terpakai
  # di target web — berkas itu tidak pernah dikompilasi di mobile.
  web: ^1.1.1
  firebase_app_check: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.14.4

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    # Didaftarkan satu per satu, BUKAN dengan glob `assets/`.
    #
    # Glob itu memborong seluruh isi folder, termasuk yang tidak pernah dipakai:
    # dua salinan model bertimestamp hasil ekspor ulang (@2 MB), sebuah .zip
    # ekspor (532 KB), model vww_96_grayscale yang tidak terpakai (531 KB) dan
    # .DS_Store. Semuanya ikut terkirim ke setiap pengguna — ~5 MB di APK Play
    # Store dan ~5 MB unduhan percuma di web.
    - assets/heroes.json
    - assets/coin_model.tflite
    - assets/images/
    - assets/audio/
    - assets/models/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # Font Outfit ikut di dalam aplikasi, menggantikan paket google_fonts yang
  # mengunduhnya dari fonts.gstatic.com setiap kali aplikasi dibuka
  # (pentest IMAGO temuan 11). Hanya bobot yang benar-benar dipakai kode:
  # normal (400), w600, dan bold (700). Lisensi: assets/fonts/outfit/OFL.txt.
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/outfit/Outfit-Regular.ttf
        - asset: assets/fonts/outfit/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/outfit/Outfit-Bold.ttf
          weight: 700

# Konfigurasi ikon peluncur. Jalankan ulang setelah mengubah logo:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/launcher/icon.png"

  android: "ic_launcher"
  # Android 8+ memangkas ikon mengikuti bentuk mask peluncur, jadi foreground-nya
  # memakai versi ber-padding agar logonya tidak terpotong.
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: "assets/launcher/icon_foreground.png"

  ios: true
  # Ikon iOS tidak boleh punya kanal alpha; logonya diratakan ke warna latar tema.
  remove_alpha_ios: true
  background_color_ios: "#0F172A"
