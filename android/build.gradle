allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.layout.buildDirectory.value(
    rootProject.layout.buildDirectory.dir("../../build").get()
)

subprojects {
    project.layout.buildDirectory.value(
        rootProject.layout.buildDirectory.dir(project.name).get()
    )
}

// Sebagian plugin lama (mis. audioplayers_android 4.0.3) mem-hardcode compileSdk 33,
// sedangkan AndroidX yang mereka tarik menuntut kompilasi terhadap API 34+.
// Blok ini HARUS berdiri sendiri dan berada di atas evaluationDependsOn di bawah:
// baris itu memicu evaluasi :app, sehingga afterEvaluate tidak bisa lagi didaftarkan
// pada project yang sudah terlanjur dievaluasi.
subprojects {
    if (!project.state.executed) {
        project.afterEvaluate {
            def androidExt = project.extensions.findByName("android")
            if (androidExt != null) {
                androidExt.compileSdkVersion 36
            }
        }
    }
}

subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
