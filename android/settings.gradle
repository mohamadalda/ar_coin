pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.13.2" apply false
    // firebase-auth 25.x dikompilasi dengan metadata Kotlin 2.4.0. Kompiler Kotlin
    // menolak membaca modul yang metadatanya lebih baru dari dirinya, jadi versi
    // ini harus >= 2.4.0 selama paket Firebase dipakai.
    id "org.jetbrains.kotlin.android" version "2.4.21" apply false
    // Membaca google-services.json dan menanamkan konfigurasinya saat build.
    id "com.google.gms.google-services" version "4.4.2" apply false
}

include ":app"
