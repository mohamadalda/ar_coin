<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="IMAGO — pindai koin komemoratif untuk melihat profil tokoh dalam format Augmented Reality.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#120B1F">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="IMAGO">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>IMAGO</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background-color: #120B1F;
    }

    /*
      Lapisan kamera.

      Elemen ini SENGAJA berada di luar Flutter, bukan sebagai platform view.
      Dua alasan:

      1. camera_web tidak bisa melakukan startImageStream (flutter#92460), dan
         elemen <video> internalnya privat — tidak terjangkau dari kode aplikasi.
         Detektor butuh elemen ini secara langsung untuk menggambar frame ke
         canvas, jadi kita yang harus memilikinya.

      2. Platform view yang bertumpuk memaksa engine Flutter memecah kanvasnya
         di tiap persilangan z-order. Dengan menaruh video di BELAKANG kanvas
         dan membuat kanvasnya transparan, Flutter cukup melukis HUD di atas —
         nol platform view, nol pemecahan kanvas.

      playsinline + muted wajib di iOS Safari, kalau tidak videonya dipaksa
      fullscreen oleh sistem.
    */
    #imago-camera {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background-color: #000;
      z-index: 0;
      display: none;
    }

    /* Kanvas Flutter duduk di atas lapisan kamera. */
    flutter-view, flt-glass-pane {
      position: relative;
      z-index: 1;
    }
  </style>
</head>
<body>
  <video id="imago-camera" playsinline muted autoplay></video>

  <script src="imago_camera.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
